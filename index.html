<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stumble Block Dash Mobile</title>
    <style>
        * { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #0b0813; font-family: 'Impact', 'Arial Black', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }

        /* UI HUD */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 5; pointer-events: none; }
        .score-card { background: linear-gradient(135deg, #ff0055, #ff5500); padding: 10px 25px; border-radius: 20px; border: 3px solid #fff; color: white; font-size: 26px; text-shadow: 2px 2px #000; box-shadow: 0 8px 15px rgba(0,0,0,0.5); }

        /* BOUTONS MOBILE TACTILE */
        .mobile-btn { position: absolute; bottom: 30px; width: 85px; height: 85px; background: rgba(255, 255, 255, 0.2); border: 4px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; display: flex; justify-content: center; align-items: center; text-shadow: 2px 2px #000; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 5; }
        .mobile-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.5); }
        #btn-jump { right: 30px; bottom: 40px; background: #00e676; border-color: #a7ffeb; }
        #btn-dash { right: 130px; bottom: 30px; background: #ff9100; border-color: #ffe0b2; width: 70px; height: 70px; font-size: 16px; }

        /* JOYSTICK VIRTUEL */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.15); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; z-index: 5; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 60px; height: 60px; background: #ff0055; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* MENUS OVERLAY */
        .overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 5, 20, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(5px); }
        .title { font-size: 64px; color: #ffeb3b; text-shadow: 5px 5px 0 #ff0055, 9px 9px 0 #000; margin: 0 0 10px 0; text-align: center; }
        .subtitle { color: #fff; font-size: 18px; margin-bottom: 30px; text-shadow: 1px 1px #000; font-family: sans-serif; text-align: center; }
        
        .play-btn { background: linear-gradient(180deg, #00e676, #00a152); border: 4px solid #fff; color: #fff; padding: 15px 60px; font-size: 32px; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 0 #007038, 0 15px 25px rgba(0,0,0,0.5); text-shadow: 2px 2px #000; }
        .play-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #007038; }

        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud">
        <div class="score-card">VAGUE <span id="wave-display">0</span></div>
    </div>

    <!-- Contrôles Tactiles -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div class="mobile-btn" id="btn-jump">SAUT</div>
    <div class="mobile-btn" id="btn-dash">DASH</div>

    <!-- Menu Principal -->
    <div id="menu-start" class="overlay">
        <h1 class="title">BLOCK DASH</h1>
        <p class="subtitle">Survissez aux vagues de murs !<br>Mobile (Tactile) | PC (Flèches / ZQSD + ESPACE)</p>
        <button class="play-btn" onclick="startGame()">JOUER</button>
    </div>

    <!-- Écran Game Over -->
    <div id="menu-over" class="overlay hidden">
        <h1 class="title" style="color: #ff1744; text-shadow: 5px 5px 0 #800000, 9px 9px 0 #000;">ÉLIMINÉ !</h1>
        <p class="subtitle" style="font-size: 24px;">Vagues réussies : <span id="final-wave" style="color: #ffeb3b;">0</span></p>
        <button class="play-btn" onclick="startGame()">REESSAYER</button>
    </div>

    <script>
        // --- MOTEUR ET PHYSIQUE ---
        const ARENA_W = 12, ARENA_L = 26;
        let scene, camera, renderer, player, playerBody;
        let isPlaying = false, wave = 0, speed = 0.18;
        let pVelocityY = 0, gravity = 0.015, jumpPower = 0.28;
        let canDoubleJump = false, isDashing = false;
        let walls = [];
        let joystickInput = { x: 0, y: 0 };

        // Clavier PC
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') handleJump(); });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f051d);
            scene.fog = new THREE.FogExp2(0x0f051d, 0.02);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 11, 16);
            camera.lookAt(0, 1, -2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lumières Néo-Arcade
            const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createStage();
            createPlayer();
            setupJoystick();

            // Boutons Tactiles
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); });
            document.getElementById('btn-dash').addEventListener('touchstart', (e) => { e.preventDefault(); handleDash(); });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createStage() {
            // Sol laser / élimination mortelle
            const lavaGeo = new THREE.PlaneGeometry(80, 80);
            const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
            const lava = new THREE.Mesh(lavaGeo, lavaMat);
            lava.rotation.x = -Math.PI / 2;
            lava.position.y = -4;
            scene.add(lava);

            // Plateforme Block Dash
            const floorGeo = new THREE.BoxGeometry(ARENA_W, 1, ARENA_L);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1538, roughness: 0.2, metalness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(0, -0.5, 0);
            floor.receiveShadow = true;
            scene.add(floor);

            // Quadrillage stylisé
            const grid = new THREE.GridHelper(ARENA_L, ARENA_L/2, 0x00ffff, 0xff0055);
            grid.position.y = 0.01;
            grid.scale.set(ARENA_W/ARENA_L, 1, 1);
            scene.add(grid);
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Corps style personnage Stumble
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00e676, roughness: 0.3 });
            playerBody = new THREE.Mesh(geo, mat);
            playerBody.position.y = 0.6;
            playerBody.castShadow = true;
            player.add(playerBody);

            // Lunettes / Visière stylisée
            const visorGeo = new THREE.BoxGeometry(0.6, 0.25, 0.3);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.1 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 0.8, -0.3);
            player.add(visor);

            scene.add(player);
            resetPlayer();
        }

        function resetPlayer() {
            player.position.set(0, 0, 7);
            pVelocityY = 0;
            canDoubleJump = true;
        }

        function handleJump() {
            if (!isPlaying) return;
            if (player.position.y <= 0.05) {
                pVelocityY = jumpPower;
                canDoubleJump = true;
            } else if (canDoubleJump) {
                // Double Saut avec effet de poussée
                pVelocityY = jumpPower * 0.85;
                canDoubleJump = false;
                handleDash();
            }
        }

        function handleDash() {
            if (!isPlaying || isDashing) return;
            isDashing = true;
            const dashDistance = 2.5;
            
            // Impulsion vers l'avant
            player.position.z -= dashDistance;
            playerBody.rotation.x = -Math.PI / 4; // Inclinaison corps
            
            setTimeout(() => {
                playerBody.rotation.x = 0;
                isDashing = false;
            }, 200);
        }

        // --- CONTROLES TACTILES (JOYSTICK) ---
        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', e => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', e => {
                if (!active) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 40);
                const angle = Math.atan2(dy, dx);

                const knX = Math.cos(angle) * dist;
                const knY = Math.sin(angle) * dist;

                knob.style.transform = `translate(${knX}px, ${knY}px)`;
                joystickInput.x = knX / 40;
                joystickInput.y = knY / 40;
            });

            const resetJoy = () => {
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                joystickInput = { x: 0, y: 0 };
            };
            window.addEventListener('touchend', resetJoy);
            window.addEventListener('touchcancel', resetJoy);
        }

        // --- MURS BLOCK DASH ---
        function spawnWallPattern() {
            wave++;
            document.getElementById('wave-display').innerText = wave;
            speed += 0.005; // Accélération progressive

            const wallGroup = new THREE.Group();
            wallGroup.position.z = -ARENA_L / 2 - 2;

            const matWall = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2 });
            const matSpike = new THREE.MeshStandardMaterial({ color: 0xffea00, metalness: 0.8 });
            const matBreakable = new THREE.MeshStandardMaterial({ color: 0x00e676, roughness: 0.8 });

            const pattern = Math.floor(Math.random() * 4);

            if (pattern === 0) {
                // Mur bas avec ligne de PIQUES mortelles au milieu
                const w = new THREE.Mesh(new THREE.BoxGeometry(ARENA_W, 1.5, 1), matWall);
                w.position.y = 0.75;
                wallGroup.add(w);

                // Piques jaunes
                for(let x = -ARENA_W/2 + 1; x < ARENA_W/2; x += 1.2) {
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 4), matSpike);
                    spike.position.set(x, 1.8, 0);
                    spike.userData = { fatal: true };
                    wallGroup.add(spike);
                }
            } 
            else if (pattern === 1) {
                // Mur haut avec passage étroit (Trou aléatoire)
                const holeX = (Math.random() * (ARENA_W - 3)) - (ARENA_W/2 - 1.5);
                for(let x = -ARENA_W/2 + 0.5; x < ARENA_W/2; x += 1) {
                    if (Math.abs(x - holeX) > 1.2) {
                        const block = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), matWall);
                        block.position.set(x, 2, 0);
                        block.userData = { fatal: true };
                        wallGroup.add(block);
                    }
                }
            }
            else if (pattern === 2) {
                // Mur destructible vert (Sauter ou Dasher à travers)
                const w = new THREE.Mesh(new THREE.BoxGeometry(ARENA_W, 3, 1), matBreakable);
                w.position.y = 1.5;
                w.userData = { breakable: true };
                wallGroup.add(w);
            }
            else if (pattern === 3) {
                // Double barrière décalée
                const b1 = new THREE.Mesh(new THREE.BoxGeometry(ARENA_W/2, 1.2, 1), matWall);
                b1.position.set(-ARENA_W/4, 0.6, 0);
                const b2 = new THREE.Mesh(new THREE.Mesh(new THREE.BoxGeometry(ARENA_W/2, 4, 1), matWall));
                b2.position.set(ARENA_W/4, 2, 0);
                b2.userData = { fatal: true };
                wallGroup.add(b1);
                wallGroup.add(b2);
            }

            scene.add(wallGroup);
            walls.push(wallGroup);
        }

        // --- BOUCLE DE JEU & COLLISIONS ---
        function update() {
            if (!isPlaying) return;

            // Déplacements (Clavier + Joystick)
            let moveX = joystickInput.x;
            let moveZ = joystickInput.y;

            if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
            if (keys['ArrowUp'] || keys['KeyW']) moveZ = -1;
            if (keys['ArrowDown'] || keys['KeyS']) moveZ = 1;

            player.position.x += moveX * 0.2;
            player.position.z += moveZ * 0.2;

            // Limites de terrain
            const limitX = ARENA_W / 2 - 0.5;
            player.position.x = Math.max(-limitX, Math.min(limitX, player.position.x));

            // Physique de Saut
            player.position.y += pVelocityY;
            pVelocityY -= gravity;

            if (player.position.y <= 0) {
                player.position.y = 0;
                pVelocityY = 0;
            }

            // Gestion Murs & Collisions
            const playerBox = new THREE.Box3().setFromObject(player);

            for (let i = walls.length - 1; i >= 0; i--) {
                const wall = walls[i];
                wall.position.z += speed;

                wall.children.forEach(child => {
                    const box = new THREE.Box3().setFromObject(child);
                    if (playerBox.intersectsBox(box)) {
                        if (child.userData.fatal) {
                            gameOver(); // Mort instantanée
                        } else if (child.userData.breakable && isDashing) {
                            // Détruire le bloc vert si on dash dedans
                            scene.remove(wall);
                            walls.splice(i, 1);
                        } else {
                            // Mur physique : repousse le joueur vers l'arrière
                            player.position.z = wall.position.z + 1.2;
                        }
                    }
                });

                if (wall.position.z > ARENA_L / 2 + 2) {
                    scene.remove(wall);
                    walls.splice(i, 1);
                }
            }

            // Spawn automatique de murs
            if (walls.length === 0 || walls[walls.length - 1].position.z > -4) {
                spawnWallPattern();
            }

            // MORS MORTELLES : Chute ou poussé hors du terrain arrière
            if (player.position.y < -1.5 || player.position.z > ARENA_L / 2) {
                gameOver();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        function startGame() {
            walls.forEach(w => scene.remove(w));
            walls = [];
            wave = 0;
            speed = 0.18;
            resetPlayer();
            
            document.getElementById('menu-start').classList.add('hidden');
            document.getElementById('menu-over').classList.add('hidden');
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('final-wave').innerText = wave;
            document.getElementById('menu-over').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
