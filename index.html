<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stumble Guys: Block Dash Deluxe</title>
    <style>
        * { touch-action: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080314; font-family: 'Arial Black', sans-serif; }
        #renderCanvas { width: 100%; height: 100%; display: block; }

        /* HUD & UI */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 5; pointer-events: none; }
        .score-box { background: linear-gradient(135deg, #ff0055, #ff5500); border: 3px solid #fff; border-radius: 15px; padding: 8px 20px; color: #fff; font-size: 24px; text-shadow: 2px 2px #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* MENUS OVERLAY */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 3, 20, 0.88); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        h1 { font-size: 48px; color: #ffea00; text-shadow: 4px 4px 0 #ff0055, 7px 7px 0 #000; margin: 0 0 10px 0; text-align: center; }
        p { color: #fff; font-size: 16px; margin-bottom: 25px; text-align: center; font-family: sans-serif; line-height: 1.5; }
        
        .btn-play { background: linear-gradient(180deg, #00e676, #00a152); border: 3px solid #fff; color: white; font-size: 28px; padding: 15px 60px; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 0 #007038; text-shadow: 2px 2px #000; outline: none; }
        .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #007038; }

        /* CONTRÔLES MOBILES */
        .touch-btn { position: absolute; width: 75px; height: 75px; background: rgba(255,255,255,0.25); border: 3px solid #fff; border-radius: 50%; color: white; font-size: 16px; display: flex; justify-content: center; align-items: center; text-shadow: 1px 1px 2px #000; z-index: 5; }
        .touch-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
        #btn-jump { right: 25px; bottom: 35px; background: #00e676; border-color: #a7ffeb; }
        #btn-dash { right: 115px; bottom: 25px; background: #ff9100; border-color: #ffe0b2; width: 65px; height: 65px; font-size: 14px; }

        #joystick-container { position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.3); border-radius: 50%; z-index: 5; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #ff0055; border: 2px solid #fff; border-radius: 50%; }

        .hidden { display: none !important; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div class="hud">
        <div class="score-box">VAGUE : <span id="wave-count">0</span></div>
    </div>

    <!-- Interface Mobile -->
    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div class="touch-btn" id="btn-dash">DASH</div>
    <div class="touch-btn" id="btn-jump">SAUT</div>

    <!-- Menu Principal -->
    <div id="start-menu" class="overlay">
        <h1>BLOCK DASH 3D</h1>
        <p>Sautez, dashez et évitez les pièges mortels !<br>Mobile : Tactile | PC : Flèches/ZQSD + Espace / Shift</p>
        <button class="btn-play" id="start-btn">JOUER</button>
    </div>

    <!-- Menu Game Over -->
    <div id="over-menu" class="overlay hidden">
        <h1 style="color: #ff1744; text-shadow: 4px 4px 0 #800000, 7px 7px 0 #000;">ÉLIMINÉ !</h1>
        <p style="font-size: 22px;">Vagues réussies : <span id="final-score" style="color: #ffea00;">0</span></p>
        <button class="btn-play" id="restart-btn">REESSAYER</button>
    </div>

    <script>
        let engine, scene, player, playerMat;
        const ARENA_W = 12, ARENA_L = 26;
        let isPlaying = false, wave = 0, gameSpeed = 0.16;
        let pVelY = 0, gravity = -0.015, jumpForce = 0.32;
        let canDoubleJump = false, isDashing = false;
        let walls = [];
        let inputMove = { x: 0, z: 0 };
        let keys = {};

        let matFloor, matWall, matBreakable, matSpike, matLaser;

        function createScene() {
            const canvas = document.getElementById("renderCanvas");
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.03, 0.01, 0.08);

            // Caméra
            const camera = new BABYLON.TargetCamera("camera", new BABYLON.Vector3(0, 11, -16), scene);
            camera.setTarget(new BABYLON.Vector3(0, 1, 3));

            // Lumière
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.8;

            // Matériaux
            matFloor = new BABYLON.StandardMaterial("matFloor", scene);
            matFloor.diffuseColor = new BABYLON.Color3(0.1, 0.05, 0.2);

            matWall = new BABYLON.StandardMaterial("matWall", scene);
            matWall.diffuseColor = new BABYLON.Color3(0.9, 0, 0.3);

            matBreakable = new BABYLON.StandardMaterial("matBreak", scene);
            matBreakable.diffuseColor = new BABYLON.Color3(0, 0.9, 0.4);
            matBreakable.alpha = 0.85;

            matSpike = new BABYLON.StandardMaterial("matSpike", scene);
            matSpike.diffuseColor = new BABYLON.Color3(1, 0.8, 0);

            matLaser = new BABYLON.StandardMaterial("matLaser", scene);
            matLaser.diffuseColor = new BABYLON.Color3(1, 0, 0.2);
            matLaser.emissiveColor = new BABYLON.Color3(1, 0, 0.2);

            // Arène / Sol
            const floor = BABYLON.MeshBuilder.CreateBox("floor", { width: ARENA_W, height: 1, depth: ARENA_L }, scene);
            floor.position = new BABYLON.Vector3(0, -0.5, 0);
            floor.material = matFloor;

            // Sol Mortel Laser
            const lava = BABYLON.MeshBuilder.CreatePlane("lava", { size: 60 }, scene);
            lava.position.y = -3;
            lava.rotation.x = Math.PI / 2;
            lava.material = matLaser;

            // Joueur
            player = BABYLON.MeshBuilder.CreateCapsule("player", { radius: 0.45, height: 1.3 }, scene);
            playerMat = new BABYLON.StandardMaterial("pMat", scene);
            playerMat.diffuseColor = new BABYLON.Color3(0, 0.9, 0.4);
            player.material = playerMat;

            resetPlayer();

            // Boucle de rendu principal
            scene.onBeforeRenderObservable.add(gameLoop);

            engine.runRenderLoop(() => scene.render());
            window.addEventListener("resize", () => engine.resize());
        }

        function resetPlayer() {
            player.position = new BABYLON.Vector3(0, 0.65, -7);
            pVelY = 0;
            canDoubleJump = true;
            isDashing = false;
        }

        function doJump() {
            if (!isPlaying) return;
            if (player.position.y <= 0.66) {
                pVelY = jumpForce;
                canDoubleJump = true;
            } else if (canDoubleJump) {
                pVelY = jumpForce * 0.85;
                canDoubleJump = false;
                doDash();
            }
        }

        function doDash() {
            if (!isPlaying || isDashing) return;
            isDashing = true;
            player.position.z += 2.2;
            setTimeout(() => { isDashing = false; }, 250);
        }

        function spawnWall() {
            wave++;
            document.getElementById('wave-count').innerText = wave;
            gameSpeed += 0.003;

            const wallGroup = new BABYLON.TransformNode("wallGroup", scene);
            wallGroup.position.z = ARENA_L / 2 + 2;

            const type = Math.floor(Math.random() * 4);

            if (type === 0) {
                // Mur bas avec piques
                const base = BABYLON.MeshBuilder.CreateBox("w", { width: ARENA_W, height: 1.2, depth: 1 }, scene);
                base.position.y = 0.6;
                base.material = matWall;
                base.parent = wallGroup;

                for(let x = -ARENA_W/2 + 1; x < ARENA_W/2; x += 1.5) {
                    const spike = BABYLON.MeshBuilder.CreateCylinder("s", { diameterTop: 0, diameterBottom: 0.6, height: 1 }, scene);
                    spike.position.set(x, 1.7, 0);
                    spike.material = matSpike;
                    spike.isFatal = true;
                    spike.parent = wallGroup;
                }
            } 
            else if (type === 1) {
                // Mur haut avec un passage (porte)
                const holeX = (Math.random() * (ARENA_W - 4)) - (ARENA_W/2 - 2);
                for(let x = -ARENA_W/2 + 0.5; x < ARENA_W/2; x += 1) {
                    if (Math.abs(x - holeX) > 1.4) {
                        const block = BABYLON.MeshBuilder.CreateBox("b", { width: 1, height: 4, depth: 1 }, scene);
                        block.position.set(x, 2, 0);
                        block.material = matWall;
                        block.isFatal = true;
                        block.parent = wallGroup;
                    }
                }
            }
            else if (type === 2) {
                // Mur vert destructible (Dasher dedans)
                const breakable = BABYLON.MeshBuilder.CreateBox("br", { width: ARENA_W, height: 3, depth: 1 }, scene);
                breakable.position.y = 1.5;
                breakable.material = matBreakable;
                breakable.isBreakable = true;
                breakable.parent = wallGroup;
            }
            else if (type === 3) {
                // Mur à double niveau décalé
                const left = BABYLON.MeshBuilder.CreateBox("l", { width: ARENA_W/2, height: 1.2, depth: 1 }, scene);
                left.position.set(-ARENA_W/4, 0.6, 0);
                left.material = matWall;
                left.parent = wallGroup;

                const right = BABYLON.MeshBuilder.CreateBox("r", { width: ARENA_W/2, height: 3.5, depth: 1 }, scene);
                right.position.set(ARENA_W/4, 1.75, 0);
                right.material = matWall;
                right.isFatal = true;
                right.parent = wallGroup;
            }

            walls.push(wallGroup);
        }

        function gameLoop() {
            if (!isPlaying) return;

            let mx = inputMove.x;
            let mz = inputMove.z;

            if (keys['ArrowLeft'] || keys['KeyA']) mx = -1;
            if (keys['ArrowRight'] || keys['KeyD']) mx = 1;
            if (keys['ArrowUp'] || keys['KeyW']) mz = 1;
            if (keys['ArrowDown'] || keys['KeyS']) mz = -1;

            player.position.x += mx * 0.18;
            player.position.z += mz * 0.18;

            const limitX = ARENA_W / 2 - 0.5;
            player.position.x = Math.max(-limitX, Math.min(limitX, player.position.x));

            player.position.y += pVelY;
            pVelY += gravity;

            if (player.position.y <= 0.65) {
                player.position.y = 0.65;
                pVelY = 0;
            }

            for (let i = walls.length - 1; i >= 0; i--) {
                const wallGroup = walls[i];
                wallGroup.position.z -= gameSpeed;

                const children = wallGroup.getChildMeshes();
                for (let child of children) {
                    if (player.intersectsMesh(child, false)) {
                        if (child.isFatal) {
                            gameOver();
                            return;
                        } else if (child.isBreakable) {
                            if (isDashing) {
                                child.dispose();
                            } else {
                                player.position.z = wallGroup.position.z - 1.2;
                            }
                        } else {
                            player.position.z = wallGroup.position.z - 1.2;
                        }
                    }
                }

                if (wallGroup.position.z < -ARENA_L / 2 - 2) {
                    wallGroup.dispose();
                    walls.splice(i, 1);
                }
            }

            if (walls.length === 0 || walls[walls.length - 1].position.z < ARENA_L / 4) {
                spawnWall();
            }

            if (player.position.y < -1.5 || player.position.z < -ARENA_L / 2 - 0.5) {
                gameOver();
            }
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'Space') doJump();
                if (e.code === 'ShiftLeft' || e.code === 'KeyE') doDash();
            });
            window.addEventListener('keyup', e => keys[e.code] = false);

            document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); doJump(); });
            document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); doDash(); });

            const zone = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let active = false, startX, startY;

            zone.addEventListener('touchstart', e => {
                active = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', e => {
                if (!active) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const dist = Math.min(Math.hypot(dx, dy), 35);
                const angle = Math.atan2(dy, dx);

                const kX = Math.cos(angle) * dist;
                const kY = Math.sin(angle) * dist;

                knob.style.transform = `translate(${kX}px, ${kY}px)`;
                inputMove.x = kX / 35;
                inputMove.z = -kY / 35;
            });

            const stopJoy = () => {
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                inputMove = { x: 0, z: 0 };
            };
            window.addEventListener('touchend', stopJoy);
            window.addEventListener('touchcancel', stopJoy);
        }

        function startGame() {
            walls.forEach(w => w.dispose());
            walls = [];
            wave = 0;
            gameSpeed = 0.16;
            resetPlayer();

            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('over-menu').classList.add('hidden');
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('final-score').innerText = wave;
            document.getElementById('over-menu').classList.remove('hidden');
        }

        // Événements d'attachement explicites sur les boutons
        window.addEventListener("load", () => {
            createScene();
            setupControls();

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
        });
    </script>
</body>
</html>
